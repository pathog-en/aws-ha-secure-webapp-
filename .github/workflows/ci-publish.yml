name: CI and Publish

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

env:
  AWS_REGION: us-east-2
  AWS_ACCOUNT_ID: "698528536903"
  ECR_REPOSITORY: aws-ha-webapp

jobs:

  terraform:
    name: Terraform validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive terraform

      - name: Initialize root Terraform
        run: terraform -chdir=terraform init -backend=false -input=false

      - name: Validate root Terraform
        run: terraform -chdir=terraform validate -no-color

      - name: Initialize ECR Terraform
        run: terraform -chdir=terraform/ecr init -backend=false -input=false

      - name: Validate ECR Terraform
        run: terraform -chdir=terraform/ecr validate -no-color

      - name: Initialize EKS Terraform
        run: terraform -chdir=terraform/eks init -backend=false -input=false

      - name: Validate EKS Terraform
        run: terraform -chdir=terraform/eks validate -no-color


  docker:
    name: Container build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build container
        run: docker build -t aws-ha-webapp:ci .


  helm:
    name: Helm validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint Helm chart
        run: helm lint platform/helm/golden-web-service

      - name: Render Helm templates
        run: helm template golden-web-service platform/helm/golden-web-service > /dev/null


  publish:
    name: Publish image to ECR
    runs-on: ubuntu-latest

    needs:
      - terraform
      - docker
      - helm

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::698528536903:role/gh-actions-ecr-push
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image
        run: |
          ECR_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          IMAGE_TAG="${GITHUB_SHA}"
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          docker build -t "${IMAGE_URI}" .
          docker push "${IMAGE_URI}"

          echo "Pushed ${IMAGE_URI}"
